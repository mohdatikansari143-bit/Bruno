<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deltarune Player</title>
<style>
:root{--bg:#0d0d14;--fg:#f2f2f7;--accent:#fd3ffd;--btn:rgba(30,30,45,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d0d14;--fg:#f2f2f7}}
:root[data-theme="dark"]{--bg:#0d0d14;--fg:#f2f2f7}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#home h1{margin:0;font-size:28px}
#home p{margin:0;opacity:.7;font-size:14px}
#play{background:var(--accent);color:#000;border:0;border-radius:999px;padding:14px 38px;font-size:18px;font-weight:700;cursor:pointer}
#stage{position:fixed;inset:0;background:#000;display:none;z-index:5}
#stage.on{display:block}
#stage iframe{width:100%;height:100%;border:0;display:block}
#stage.rot{top:0;left:100vw;right:auto;bottom:auto;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:top left;transform:rotate(90deg)}
#bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;display:flex;gap:8px;z-index:10;opacity:.9}
#bar.min button:not(#tog){display:none}
#bar button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:var(--btn);color:var(--fg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#bar button.active{background:var(--accent);color:#000}
#close{background:#c0392b!important}
#toast{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);background:var(--btn);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:11;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="home">
  <h1>🎮 Deltarune</h1>
  <p>Play dabao, game full screen mein khulega</p>
  <button id="play">▶ Play</button>
</div>

<div id="stage">
  <div id="bar">
    <button id="mute" title="Mute / Unmute">🔊</button>
    <button id="land" title="Landscape">🔄</button>
    <button id="full" title="Full screen">⛶</button>
    <button id="close" title="Band karo">✕</button>
    <button id="tog" title="Buttons chhupao">⋮</button>
  </div>
  <div id="toast"></div>
</div>

<script>
(function(){
  var GAME="https://nite.games/embed/deltarune";
  var stage=document.getElementById('stage'),bar=document.getElementById('bar'),
      toast=document.getElementById('toast'),frame=null,muted=false,tt;

  function say(m){toast.textContent=m;toast.style.display='block';clearTimeout(tt);tt=setTimeout(function(){toast.style.display='none'},3500)}

  function isFull(){return document.fullscreenElement||document.webkitFullscreenElement}
  function goFull(){
    var r=stage.requestFullscreen||stage.webkitRequestFullscreen;
    if(r){try{var p=r.call(stage);if(p&&p.catch)p.catch(function(){});return p}catch(e){}}
    return null;
  }
  function exitFull(){
    var x=document.exitFullscreen||document.webkitExitFullscreen;
    if(x&&isFull()){try{x.call(document)}catch(e){}}
  }

  function start(){
    stage.classList.add('on');
    frame=document.createElement('iframe');
    frame.src=GAME;
    frame.allow="fullscreen; autoplay; gamepad; pointer-lock";
    stage.insertBefore(frame,bar);
    goFull();
  }

  function stop(){
    exitFull();
    try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
    stage.classList.remove('on','rot');
    if(frame){frame.remove();frame=null}
    muted=false;document.getElementById('mute').textContent='🔊';
    document.getElementById('mute').classList.remove('active');
    document.getElementById('land').classList.remove('active');
  }

  function landscape(){
    var btn=document.getElementById('land');
    if(stage.classList.contains('rot')){stage.classList.remove('rot');btn.classList.remove('active');return}
    var tried=false;
    function fallback(){
      if(window.innerHeight>window.innerWidth){stage.classList.add('rot')}
      btn.classList.add('active');
    }
    var p=goFull();
    function lock(){
      try{
        if(screen.orientation&&screen.orientation.lock){
          return screen.orientation.lock('landscape').then(function(){btn.classList.add('active')}).catch(fallback);
        }
      }catch(e){}
      fallback();
    }
    if(p&&p.then){p.then(lock,lock)}else{setTimeout(lock,50)}
  }

  function toggleMute(){
    muted=!muted;
    var b=document.getElementById('mute');
    b.textContent=muted?'🔇':'🔊';
    b.classList.toggle('active',muted);
    try{frame&&frame.contentWindow.postMessage({type:muted?'mute':'unmute',muted:muted},'*')}catch(e){}
    say('Browser dusre site ke game ko seedha mute nahi karne deta. Awaz band na ho to phone ke volume button use karo.');
  }

  document.getElementById('play').onclick=start;
  document.getElementById('close').onclick=stop;
  document.getElementById('mute').onclick=toggleMute;
  document.getElementById('land').onclick=landscape;
  document.getElementById('full').onclick=function(){isFull()?exitFull():goFull()};
  document.getElementById('tog').onclick=function(){bar.classList.toggle('min')};
})();
</script>
</body>
</html>
